name: habit_app
description: Pengingat kebiasaan dengan template dan notifikasi.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: assets/icon_fg.png
