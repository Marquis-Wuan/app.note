name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Membuat folder android otomatis, lalu menyesuaikannya untuk notifikasi
      - run: flutter create --platforms=android --project-name habit_app --org com.example .
      - run: python3 tool/patch.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      # Hasil build selalu bernama app-release.apk; disalin ke habit_app.apk
      - run: cp build/app/outputs/flutter-apk/app-release.apk habit_app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: habit-app-apk
          path: habit_app.apk
          
